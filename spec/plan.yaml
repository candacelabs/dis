    agent_prompt: |
      You are implementing the CLI wiring layer for `dis` — connecting cobra commands to all subsystems.

      ## Context
      This is the final integration layer. Each cobra command follows a pattern:
      1. Parse flags
      2. Resolve config (if needed)
      3. Create manager (if needed)
      4. Delegate to subsystem
      5. Handle errors with user-friendly messages
      6. Exit with appropriate code

      ## Proto Contract (see spec/contracts/cli.proto)

      ## Dependencies (from all previous levels)
      - `internal/config` — ResolveConfig, DockerfileExists, DisConfig
      - `internal/container` — NewManager, Manager (Up, Down, Exec, Status, Rebuild, Logs)
      - `internal/scaffold` — Init, InitOptions
      - `internal/proxy` — RunCommand, InteractiveShell, ExitCodeError

      ## File Structure

      ### cmd/dis/main.go (UPDATE — already exists from A0)
      Update to call root command Execute().

      ### cmd/dis/root.go
      ```go
      package main

      import (
          "fmt"
          "os"
          "github.com/spf13/cobra"
      )

      var version = "0.1.0"

      var rootCmd = &cobra.Command{
          Use:     "dis",
          Short:   "Simple, plug-and-play dev containers",
          Long:    "dis — simple, plug-and-play dev containers.\nPart of Candace Labs.",
          Version: version,
      }

      func Execute() {
          if err := rootCmd.Execute(); err != nil {
              os.Exit(1)
          }
      }

      func init() {
          rootCmd.AddCommand(initCmd)
          rootCmd.AddCommand(upCmd)
          rootCmd.AddCommand(downCmd)
          rootCmd.AddCommand(runCmd)
          rootCmd.AddCommand(shellCmd)
          rootCmd.AddCommand(statusCmd)
          rootCmd.AddCommand(rebuildCmd)
          rootCmd.AddCommand(logsCmd)
          rootCmd.AddCommand(nutsCmd)
          rootCmd.AddCommand(asterCmd)
      }
      ```

      ### cmd/dis/helpers.go
      Common helper functions:
      ```go
      package main

      import (
          "fmt"
          "os"
          "github.com/candacelabs/dis/internal/config"
          "github.com/candacelabs/dis/internal/container"
      )

      // mustResolveConfig resolves config or exits with helpful error.
      func mustResolveConfig() *config.DisConfig {
          cwd, err := os.Getwd()
          if err != nil {
              fmt.Fprintf(os.Stderr, "Error: %v\n", err)
              os.Exit(1)
          }
          cfg, err := config.ResolveConfig(cwd)
          if err != nil {
              fmt.Fprintf(os.Stderr, "Error: %v\n", err)
              fmt.Fprintf(os.Stderr, "Run 'dis init' to set up your dev environment.\n")
              os.Exit(1)
          }
          return cfg
      }

      // mustCreateManager creates a container manager or exits with helpful error.
      func mustCreateManager(cfg *config.DisConfig) *container.Manager {
          mgr, err := container.NewManager(cfg)
          if err != nil {
              fmt.Fprintf(os.Stderr, "Error: %v\n", err)
              os.Exit(1)
          }
          return mgr
      }

      // handleExitCode checks if err is an ExitCodeError and exits with that code.
      func handleExitCode(err error) {
          // type-assert for proxy.ExitCodeError, exit with its code
      }
      ```

      ### cmd/dis/init.go
      ```go
      var initForce bool

      var initCmd = &cobra.Command{
          Use:   "init",
          Short: "Initialize dis in the current project",
          Long:  "Detect project type, generate .dis/Dockerfile and Justfile.",
          RunE: func(cmd *cobra.Command, args []string) error {
              cwd, _ := os.Getwd()
              return scaffold.Init(cwd, scaffold.InitOptions{Force: initForce})
          },
      }

      func init() {
          initCmd.Flags().BoolVar(&initForce, "force", false, "Overwrite existing files")
      }
      ```

      ### cmd/dis/up.go
      - Resolve config → create manager → manager.Up(ctx)
      - Print emoji-formatted output

      ### cmd/dis/down.go
      - Resolve config → create manager → manager.Down(ctx)

      ### cmd/dis/run.go
      ```go
      var runCmd = &cobra.Command{
          Use:                "run [command...]",
          Short:              "Run a command inside the dev container",
          DisableFlagParsing: true,  // pass all args through
          RunE: func(cmd *cobra.Command, args []string) error {
              cfg := mustResolveConfig()
              mgr := mustCreateManager(cfg)
              err := proxy.RunCommand(cmd.Context(), mgr, args)
              handleExitCode(err)
              return err
          },
      }
      ```
      IMPORTANT: DisableFlagParsing=true so `dis run make test -v` passes `-v` through.

      ### cmd/dis/shell.go
      - Resolve config → create manager → proxy.InteractiveShell(ctx, mgr, cfg)

      ### cmd/dis/status.go
      - Resolve config → create manager → manager.Status(ctx)
      - Format output as described in cli.proto

      ### cmd/dis/rebuild.go
      - Resolve config → create manager → manager.Rebuild(ctx)

      ### cmd/dis/logs.go
      - Flags: --follow (-f), --tail (default "100")
      - Resolve config → create manager → manager.Logs(ctx, follow, tail)

      ### cmd/dis/easter.go
      ```go
      var nutsCmd = &cobra.Command{
          Use:    "nuts",
          Short:  "🥜",
          Hidden: true,
          RunE: func(cmd *cobra.Command, args []string) error {
              fmt.Println("🥜 dis nuts — system info")
              fmt.Printf("dis version: %s\n", version)
              // Docker version via client
              // OS/arch via runtime.GOOS/GOARCH
              // Project info if .dis/Dockerfile exists
              return nil
          },
      }

      var asterCmd = &cobra.Command{
          Use:    "aster",
          Short:  "💥",
          Hidden: true,
          RunE: func(cmd *cobra.Command, args []string) error {
              // Same as `dis logs --tail 50` but only error-level output
              cfg := mustResolveConfig()
              mgr := mustCreateManager(cfg)
              return mgr.Logs(cmd.Context(), false, "50")
          },
      }
      ```

      ### cmd/dis/main.go (UPDATE)
      Replace the skeleton from A0:
      ```go
      package main

      func main() {
          Execute()
      }
      ```

      ## Error Handling Patterns

      All commands that need Docker:
      ```
      Error: Docker is not running. Start Docker Desktop (or dockerd) and try again.
      ```

      All commands that need .dis/Dockerfile:
      ```
      Error: No .dis/Dockerfile found.
      Run 'dis init' to set up your dev environment.
      ```

      `dis run` / `dis shell` when container not running:
      ```
      Error: Dev container is not running.
      Run 'dis up' (or 'just dev') first.
      ```

      ## Acceptance Criteria
      1. `go build ./cmd/dis/` succeeds
      2. `./dis --version` prints version
      3. `./dis` prints help with all commands listed
      4. `./dis init --force` calls scaffold.Init with Force=true
      5. `./dis run echo hello` passes ["echo", "hello"] to proxy.RunCommand
      6. `./dis logs -f --tail 200` passes follow=true, tail="200"
      7. `./dis nuts` prints system info (hidden from help)
      8. Non-zero exit from proxied command → dis exits with same code
      9. All error messages are helpful and suggest the fix

# =============================================================================
# Dispatch Table
# =============================================================================

dispatch:
  - level: 0
    agents: [A0, A1, A2, A3]
    parallelism: 4
    blocked_by: nothing
    gate: "go test ./internal/config/ ./internal/container/ ./internal/scaffold/ ./internal/forward/"
    estimated_time: "2-3 hours"

  - level: 1
    agents: [A4, A5]
    parallelism: 2
    blocked_by: "Level 0 gate"
    gate: "go test ./internal/container/ ./internal/scaffold/"
    estimated_time: "3-4 hours"

  - level: 2
    agents: [A6]
    parallelism: 1
    blocked_by: "Level 1 gate"
    gate: "go test ./internal/proxy/"
    estimated_time: "1-2 hours"

  - level: 3
    agents: [A7]
    parallelism: 1
    blocked_by: "Level 2 gate"
    gate: "go build ./cmd/dis/ && go test ./..."
    estimated_time: "2-3 hours"

# =============================================================================
# Coordinator Protocol
# =============================================================================

coordinator:
  bootstrap:
    - "Create directory structure: cmd/dis/, internal/{config,container,scaffold,proxy,forward}/"
    - "Agent A0 initializes go.mod and skeleton — must complete before Level 1 agents can import packages"
    - "All Level 0 agents write to non-overlapping packages"

  gate_protocol:
    - "After each level completes, run the gate command"
    - "If gate fails: identify failing agent, re-run with error context"
    - "If gate passes: dispatch next level"
    - "Final gate: go build ./cmd/dis/ && go test ./... && ./dis --version"

  proto_validation:
    - "After A1: verify DisConfig struct has all fields from config.proto"
    - "After A2: verify DetectProjectType returns all 5 enum values"
    - "After A3: verify functions return Docker SDK types (mount.Mount, nat.PortMap)"
    - "After A4: verify Manager has all methods from container.proto"
    - "After A5: verify Init and GenerateJustfile signatures match scaffold.proto"
    - "After A6: verify RunCommand and InteractiveShell use ContainerRunner interface"
    - "After A7: verify all cobra commands are registered and compile"

  resume_protocol:
    - "Check which agent output files exist"
    - "Run tests for completed agents to verify they still pass"
    - "Skip completed agents, dispatch from next incomplete level"
    - "If partial level: only dispatch incomplete agents from that level"

# =============================================================================
# Hard Rules
# =============================================================================

hard_rules:
  - "No agent imports another agent's internals (only public API from completed upstream agents)"
  - "Tests are the only completion signal"
  - "Proto contract files define the only legal types at agent boundaries"
  - "The coordinator never writes application code"
  - "File ownership is exclusive — no two agents write to the same file"
  - "Proto mismatches are hard failures — if output doesn't match proto, agent has failed"
  - "A0 must complete before any Level 1 agent runs (go.mod must exist for imports)"
  - "All Docker SDK usage is confined to internal/container/ and internal/forward/"
  - "All cobra command wiring is confined to cmd/dis/"
  - "No global state — config is always passed explicitly"
  - "Error messages always suggest the fix (e.g., 'Run dis init to set up')"
