      - internal/scaffold/justfile.go
      - internal/scaffold/justfile_test.go
    test_glob: "internal/scaffold/init_test.go internal/scaffold/justfile_test.go"
    description: >
      Implement `dis init` orchestration: detect project type, generate
      .dis/Dockerfile from template, generate Justfile. Handles existing files,
      force flag, and user messaging.
    complexity: M
    acceptance_criteria:
      - "Init creates .dis/ directory if it doesn't exist"
      - "Init generates .dis/Dockerfile from detected project type template"
      - "Init generates Justfile with standard dis recipes"
      - "Init refuses to overwrite existing .dis/Dockerfile without --force"
      - "Init with --force overwrites existing files"
      - "Init prints summary: detected type, files created"
      - "Init warns if 'just' command not found on PATH"
      - "GenerateJustfile produces valid Justfile with dev/shell/down/run/build/test/lint recipes"
      - "Generated Justfile has correct 'dis run' proxy pattern"
      - "All tests pass with go test ./internal/scaffold/"

    agent_prompt: |
      You are implementing the `dis init` scaffold system.

      ## Context
      `dis init` is the first command users run. It detects their project type and
      generates a `.dis/Dockerfile` and `Justfile` tailored to their stack.

      ## Dependencies (from Level 0 agents)
      - `internal/scaffold/detect.go` — DetectProjectType(projectRoot) ProjectType
      - `internal/scaffold/templates.go` — DockerfileTemplate(projectType) string
      - `internal/config/convention.go` — DockerfileExists(projectRoot) bool

      ## Types to Implement

      ```go
      // internal/scaffold/init.go
      package scaffold

      import "github.com/candacelabs/dis/internal/config"

      type InitOptions struct {
          Force       bool        // overwrite existing files
          ProjectType ProjectType // override auto-detection (zero value = auto-detect)
      }

      // Init orchestrates the full `dis init` flow.
      // Creates .dis/Dockerfile and Justfile in projectRoot.
      func Init(projectRoot string, opts InitOptions) error
      ```

      ```go
      // internal/scaffold/justfile.go
      package scaffold

      // GenerateJustfile returns the content of the standard dis Justfile.
      func GenerateJustfile() string
      ```

      ## Init Behavior
      1. Check if `.dis/Dockerfile` exists:
         - If exists and !opts.Force: return error "dis is already initialized. Use --force to overwrite."
         - If exists and opts.Force: continue (will overwrite)
      2. Detect project type:
         - If opts.ProjectType is set (non-zero): use it
         - Else: call DetectProjectType(projectRoot)
      3. Generate Dockerfile: DockerfileTemplate(projectType)
      4. Create `.dis/` directory: `os.MkdirAll(filepath.Join(projectRoot, ".dis"), 0755)`
      5. Write `.dis/Dockerfile`: os.WriteFile with 0644
      6. Check if `Justfile` exists:
         - If exists and !opts.Force: print warning "Justfile already exists, skipping. Use --force to overwrite."
         - If exists and opts.Force: overwrite
         - If not exists: write it
      7. Generate Justfile: GenerateJustfile()
      8. Write `Justfile` if applicable
      9. Check if `just` is on PATH: exec.LookPath("just")
         - If not found: print warning "⚠️  'just' is not installed. Install: https://github.com/casey/just"
      10. Print summary:
          ```
          ✅ dis initialized!
             Project type: node
             Created: .dis/Dockerfile
             Created: Justfile

             Next steps:
               just dev     # start dev environment
               just shell   # enter container
          ```

      ## Justfile Content
      ```just
      # Development environment powered by dis (https://github.com/candacelabs/dis)

      default:
          @just --list

      # Start the dev environment
      dev:
          dis up

      # Drop into container shell
      shell:
          dis shell

      # Stop the dev environment
      down:
          dis down

      # Proxy any command through the dev container
      run *args:
          dis run {{args}}

      # Build the project (inside container)
      build *args:
          dis run make build {{args}}

      # Run tests (inside container)
      test *args:
          dis run make test {{args}}

      # Run linter (inside container)
      lint:
          dis run make lint

      # Show dev environment status
      status:
          dis status

      # Force rebuild dev environment
      rebuild:
          dis rebuild
      ```
      NOTE: The double-brace `{{args}}` is Justfile syntax, not Go template syntax.
      Make sure to output literal `{{args}}` in the generated string.

      ## Tests

      ### init_test.go
      Use t.TempDir() for isolated test directories.
      1. TestInit_NewProject — empty dir → creates .dis/Dockerfile and Justfile
      2. TestInit_DetectsNode — dir with package.json → Dockerfile has "FROM node:"
      3. TestInit_DetectsPython — dir with requirements.txt → Dockerfile has "FROM python:"
      4. TestInit_ExistingDockerfile_NoForce — .dis/Dockerfile exists → returns error
      5. TestInit_ExistingDockerfile_Force — .dis/Dockerfile exists + Force=true → overwrites
      6. TestInit_ExistingJustfile_NoForce — Justfile exists → skips Justfile, still creates Dockerfile
      7. TestInit_OverrideProjectType — opts.ProjectType=Go → uses Go template regardless of files
      8. TestInit_CreatesDisDirectory — .dis/ doesn't exist → creates it

      ### justfile_test.go
      1. TestGenerateJustfile_HasDevRecipe — contains "dev:" and "dis up"
      2. TestGenerateJustfile_HasShellRecipe — contains "shell:" and "dis shell"
      3. TestGenerateJustfile_HasRunProxy — contains "run *args:" and "dis run"
      4. TestGenerateJustfile_HasBuildRecipe — contains "build" and "dis run make build"
      5. TestGenerateJustfile_HasTestRecipe — contains "test" and "dis run make test"

      ## Acceptance Criteria
      1. All tests pass: `go test ./internal/scaffold/`
      2. Init creates valid .dis/Dockerfile for each project type
      3. Init creates valid Justfile with all standard recipes
      4. Init is safe by default (won't overwrite without --force)
      5. Generated Justfile uses correct `{{args}}` syntax (literal double braces)

  - id: A6
    name: proxy_exec
    level: 2
    depends_on: [A4]
    input_protos: [ExecSpec, IsRunningSpec]
    output_protos: [RunCommandSpec, InteractiveShellSpec]
    reads:
      - internal/container/manager.go
    writes:
      - internal/proxy/exec.go
      - internal/proxy/exec_test.go
    test_glob: "internal/proxy/exec_test.go"
    description: >
      Implement `dis run` and `dis shell` UX wrappers around Manager.Exec.
      Handles container-not-running errors, exit code propagation, signal forwarding.
    complexity: M
    acceptance_criteria:
      - "RunCommand checks container is running before exec"
      - "RunCommand returns helpful error if container not running"
      - "RunCommand propagates exit code from container command"
      - "RunCommand streams stdout/stderr to host"
      - "InteractiveShell opens TTY shell with correct shell from config"
      - "InteractiveShell returns shell exit code"
      - "Signal forwarding: SIGINT during RunCommand is handled gracefully"
      - "All tests pass with go test ./internal/proxy/"

    agent_prompt: |
      You are implementing the command proxy layer for `dis` — the `dis run` and `dis shell` logic.

      ## Context
      `dis run <cmd>` and `dis shell` are the most-used commands. They wrap the container
      manager's Exec method with UX: checking the container is running, formatting errors,
      propagating exit codes, and handling signals.

      ## Proto Contract (see spec/contracts/proxy.proto)

      ## Dependencies
      - `internal/container/manager.go` — Manager.Exec(), Manager.IsRunning()
      - `internal/config/convention.go` — DisConfig.Shell

      ## Types to Implement

      ```go
      // internal/proxy/exec.go
      package proxy

      import (
          "context"
          "fmt"
          "os"
          "os/signal"
          "syscall"

          "github.com/candacelabs/dis/internal/container"
          "github.com/candacelabs/dis/internal/config"
      )

      // RunCommand executes a command inside the running dev container.
      // Returns an error that wraps the exit code if the command fails.
      func RunCommand(ctx context.Context, mgr *container.Manager, args []string) error

      // InteractiveShell drops into an interactive shell in the dev container.
      func InteractiveShell(ctx context.Context, mgr *container.Manager, cfg *config.DisConfig) error
      ```

      ## ExitCodeError
      Define a custom error type to carry exit codes:
      ```go
      type ExitCodeError struct {
          Code int
      }

      func (e *ExitCodeError) Error() string {
          return fmt.Sprintf("command exited with code %d", e.Code)
      }
      ```

      ## RunCommand Behavior
      1. Check `mgr.IsRunning(ctx)`:
         - If not running: return error "Dev container is not running. Run 'dis up' (or 'just dev') first."
      2. Set up signal handling:
         - Catch SIGINT, SIGTERM
         - On signal: cancel the context (which should propagate to Docker exec)
      3. Call `mgr.Exec(ctx, args, false)` — non-interactive
      4. If exit code != 0: return &ExitCodeError{Code: exitCode}
      5. Return nil on success

      ## InteractiveShell Behavior
      1. Check `mgr.IsRunning(ctx)`:
         - If not running: return same error as RunCommand
      2. Determine shell: cfg.Shell (already resolved with default /bin/bash)
      3. Call `mgr.Exec(ctx, []string{cfg.Shell}, true)` — interactive with TTY
      4. If exit code != 0: return &ExitCodeError{Code: exitCode}
      5. Return nil

      ## Tests

      ### exec_test.go
      Create mock Manager for testing (or use an interface):

      ```go
      type MockManager struct {
          running  bool
          execCode int
          execErr  error
          execCmds [][]string // record calls
      }
      ```

      To make this testable, either:
      a) Extract an interface from Manager (preferred):
         ```go
         type ContainerRunner interface {
             IsRunning(ctx context.Context) (bool, error)
             Exec(ctx context.Context, cmd []string, interactive bool) (int, error)
         }
         ```
         Make RunCommand and InteractiveShell accept ContainerRunner instead of *Manager.
      b) Or use the concrete Manager with a mocked Docker client.

      Option (a) is cleaner. Use it.

      1. TestRunCommand_Success — mock running=true, execCode=0 → nil error
      2. TestRunCommand_NotRunning — mock running=false → error contains "not running"
      3. TestRunCommand_NonZeroExit — mock execCode=1 → ExitCodeError{Code: 1}
      4. TestRunCommand_CommandPassthrough — verify args passed to Exec unchanged
      5. TestInteractiveShell_Success — mock running=true, execCode=0 → nil
      6. TestInteractiveShell_NotRunning — mock running=false → error contains "not running"
      7. TestInteractiveShell_UsesConfigShell — verify shell from config is passed to Exec

      ## Acceptance Criteria
      1. All tests pass: `go test ./internal/proxy/`
      2. RunCommand and InteractiveShell use the ContainerRunner interface (testable)
      3. Exit codes propagate correctly via ExitCodeError
      4. Error messages are user-friendly and suggest the fix ("Run 'dis up' first")

