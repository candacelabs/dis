      - "HistoryVolume('myproject', '/bin/zsh') returns volume targeting ~/.zsh_history"
      - "All tests pass with go test ./internal/forward/"

    agent_prompt: |
      You are implementing host-to-container forwarding for `dis`.

      ## Context
      When dis creates a container, it needs to forward host credentials and configuration
      into the container so git, ssh, and port access work seamlessly. These functions
      return Docker SDK-compatible mount and port configurations.

      ## Proto Contract (see spec/contracts/forward.proto)

      ## Dependencies
      ```go
      import (
          "github.com/docker/docker/api/types/mount"
          "github.com/docker/go-connections/nat"
      )
      ```

      ### internal/forward/git.go
      ```go
      package forward

      import "github.com/docker/docker/api/types/mount"

      // GitMounts returns Docker bind mounts and env vars for git credential forwarding.
      // Mounts ~/.gitconfig (or ~/.config/git/config) read-only into the container.
      // Extracts GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL from `git config` on the host.
      func GitMounts() ([]mount.Mount, []string, error)
      ```

      Behavior:
      1. Check if `~/.gitconfig` exists → mount to `/root/.gitconfig` read-only
      2. Else check if `~/.config/git/config` exists → mount to `/root/.config/git/config` read-only
      3. Run `git config --global user.name` and `git config --global user.email` on host
      4. If found, add as env vars: `GIT_AUTHOR_NAME=...`, `GIT_AUTHOR_EMAIL=...`, `GIT_COMMITTER_NAME=...`, `GIT_COMMITTER_EMAIL=...`
      5. Return (mounts, envVars, nil). Never error for missing config — just return less.

      ### internal/forward/ssh.go
      ```go
      package forward

      import "github.com/docker/docker/api/types/mount"

      // SSHMounts returns Docker bind mounts and env vars for SSH agent forwarding.
      // Mounts SSH_AUTH_SOCK and ~/.ssh/known_hosts into the container.
      func SSHMounts() ([]mount.Mount, []string, error)
      ```

      Behavior:
      1. Read `SSH_AUTH_SOCK` env var
      2. If set and socket file exists: mount it to same path in container, add env var `SSH_AUTH_SOCK=<path>`
      3. If `~/.ssh/known_hosts` exists: mount read-only to `/root/.ssh/known_hosts`
      4. Never error — just return whatever is available

      ### internal/forward/ports.go
      ```go
      package forward

      import "github.com/docker/go-connections/nat"

      // PortBindings converts a list of port numbers into Docker SDK port configuration.
      // Each port maps host:port → container:port/tcp (same number on both sides).
      func PortBindings(ports []int) (nat.PortMap, nat.PortSet, error)
      ```

      Behavior:
      1. For each port in the input list:
         - Create nat.Port: `<port>/tcp`
         - Add to PortSet (ExposedPorts)
         - Add to PortMap: `<port>/tcp` → [{HostIP: "0.0.0.0", HostPort: "<port>"}]
      2. Return (portMap, portSet, nil)

      ### internal/forward/history.go
      ```go
      package forward

      import "github.com/docker/docker/api/types/mount"

      // HistoryVolume returns a named Docker volume mount for persisting shell history.
      // Volume name: "dis-<projectName>-history"
      // Target path depends on shell: bash→/root/.bash_history, zsh→/root/.zsh_history
      func HistoryVolume(projectName string, shell string) mount.Mount
      ```

      ## Test Cases

      Use testify/assert. For git/ssh tests, you can test the logic by:
      - Mocking env vars with `t.Setenv`
      - Creating temp files for config paths (override home dir lookup via a helper)

      Design the functions to accept an optional home dir parameter (or use a package-level
      variable for testing) so tests don't depend on the actual home directory.

      ### git_test.go
      1. TestGitMounts_WithGitconfig — temp dir with .gitconfig, verify mount returned
      2. TestGitMounts_WithXDGConfig — temp dir with .config/git/config, verify mount
      3. TestGitMounts_NoConfig — empty temp dir, verify empty mounts (no error)

      ### ssh_test.go
      1. TestSSHMounts_WithAuthSock — set SSH_AUTH_SOCK to temp file, verify mount + env var
      2. TestSSHMounts_NoAuthSock — unset SSH_AUTH_SOCK, verify empty (no error)
      3. TestSSHMounts_WithKnownHosts — temp known_hosts file, verify read-only mount

      ### ports_test.go
      1. TestPortBindings_MultiplePorts — [3000, 8080] → verify PortMap has both
      2. TestPortBindings_SinglePort — [3000] → verify single mapping
      3. TestPortBindings_EmptyPorts — [] → empty map, no error
      4. TestPortBindings_PortMapFormat — verify host port string matches container port

      ### history_test.go
      1. TestHistoryVolume_Bash — verify volume name and .bash_history target
      2. TestHistoryVolume_Zsh — verify volume name and .zsh_history target
      3. TestHistoryVolume_VolumeName — verify "dis-myproject-history" format

      ## Acceptance Criteria
      1. All tests pass: `go test ./internal/forward/`
      2. Functions return Docker SDK types directly (mount.Mount, nat.PortMap, nat.PortSet)
      3. No function panics or errors when host config is missing — graceful degradation
      4. History volume uses named volume (not bind mount) for persistence across container recreates

  - id: A4
    name: container_manager
    level: 1
    depends_on: [A0, A1, A3]
    input_protos: [DisConfig, GitForwardOutput, SSHForwardOutput, PortBindingsOutput, HistoryVolumeOutput]
