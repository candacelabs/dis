      - "ResolveConfig returns clear error if .dis/Dockerfile missing"
      - "All tests pass with go test ./internal/config/ ./internal/container/"

    agent_prompt: |
      You are implementing the config and label parsing layer for `dis`, a Go CLI dev container tool.

      ## Context
      dis uses ZERO config files. All configuration comes from LABELs in `.dis/Dockerfile`.
      Your code parses these labels and produces a resolved config struct.

      ## Proto Contract (see spec/contracts/config.proto)

      ### Types to implement:

      ```go
      // internal/config/convention.go
      package config

      // DisConfig is the fully resolved configuration for a dis project.
      type DisConfig struct {
          ProjectName   string
          DockerfilePath string    // always ".dis/Dockerfile"
          WorkspaceDir  string     // default "/workspace"
          Ports         []int
          EnvVars       []EnvVar
          ExtraMounts   []Mount
          Shell         string     // default "/bin/bash"
          PostCreate    string
          ImageName     string     // "dis-<ProjectName>"
          ContainerName string     // "dis-<ProjectName>-dev"
      }

      type EnvVar struct {
          Key   string
          Value string
      }

      type Mount struct {
          Source   string
          Target   string
          ReadOnly bool
      }

      // ResolveConfig finds .dis/Dockerfile in projectRoot, parses labels, applies defaults.
      func ResolveConfig(projectRoot string) (*DisConfig, error)

      // DockerfileExists checks if .dis/Dockerfile exists.
      func DockerfileExists(projectRoot string) bool
      ```

      ```go
      // internal/container/labels.go
      package container

      // ParseLabelsFromDockerfile reads a Dockerfile and extracts dis.* LABEL values.
      // Supports both `LABEL key=value` and `LABEL key="value"` formats.
      // Supports multi-label: `LABEL key1=val1 key2=val2`
      func ParseLabelsFromDockerfile(dockerfilePath string) (map[string]string, error)
      ```

      ## Label Parsing Rules
      1. Read Dockerfile line by line
      2. Find lines starting with `LABEL` (case-insensitive after trimming)
      3. Handle continuation lines (trailing `\`)
      4. Parse `LABEL dis.ports="3000,8080"` → key="dis.ports", value="3000,8080"
      5. Parse `LABEL dis.shell=/bin/zsh` → key="dis.shell", value="/bin/zsh"
      6. Only extract labels starting with "dis."
      7. Strip surrounding quotes from values

      ## Config Resolution Rules
      1. `projectRoot` is the directory containing the project (has `.dis/` subdirectory)
      2. ProjectName = filepath.Base(projectRoot) (sanitized: lowercase, replace spaces with hyphens)
      3. DockerfilePath = filepath.Join(projectRoot, ".dis", "Dockerfile")
      4. If DockerfilePath doesn't exist → return wrapped error with helpful message
      5. Parse labels from Dockerfile
      6. Apply defaults:
         - Shell: "/bin/bash" if dis.shell not set
         - WorkspaceDir: "/workspace"
         - Ports: empty if dis.ports not set
         - EnvVars: empty if dis.env not set
      7. Parse dis.ports: split by comma, convert each to int, error on non-numeric
      8. Parse dis.env: split by comma, each item split by first "=" into key/value
      9. Parse dis.mounts: split by comma, each item split by ":" into source/target
      10. ImageName = "dis-" + ProjectName
      11. ContainerName = "dis-" + ProjectName + "-dev"

      ## Test Cases (convention_test.go)
      1. TestResolveConfig_FullLabels — Dockerfile with all labels set
      2. TestResolveConfig_Defaults — Dockerfile with no dis.* labels
      3. TestResolveConfig_MissingDockerfile — returns error with helpful message
      4. TestResolveConfig_ProjectNaming — verifies image/container name derivation
      5. TestResolveConfig_InvalidPort — non-numeric port returns error
      6. TestResolveConfig_EmptyPorts — dis.ports="" returns empty slice

      ## Test Cases (labels_test.go)
      1. TestParseLabels_SingleLabel — one LABEL per line
      2. TestParseLabels_MultiLabel — multiple key=value on one LABEL line
      3. TestParseLabels_QuotedValues — values in single and double quotes
      4. TestParseLabels_ContinuationLines — LABEL with backslash continuation
      5. TestParseLabels_NonDisLabels — non-dis labels are ignored
      6. TestParseLabels_EmptyFile — returns empty map, no error
      7. TestParseLabels_MissingFile — returns error

      ## Acceptance Criteria
      1. All test cases pass: `go test ./internal/config/ ./internal/container/`
      2. ParseLabelsFromDockerfile correctly extracts all dis.* labels
      3. ResolveConfig produces correct DisConfig for a fully-labeled Dockerfile
      4. ResolveConfig applies all defaults for a bare Dockerfile
      5. Error messages are user-friendly: "No .dis/Dockerfile found in /path. Run 'dis init' to set up."

