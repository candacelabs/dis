    agent_prompt: |
      You are implementing the container manager for `dis` — the core Docker lifecycle engine.

      ## Context
      This is the heart of dis. It wraps the Docker Go SDK to manage a single dev container
      per project. It depends on the config layer (A1) for configuration and the forward
      layer (A3) for host-to-container forwarding.

      ## Proto Contract (see spec/contracts/container.proto)

      ## Imports
      ```go
      import (
          "context"
          "crypto/sha256"
          "fmt"
          "io"
          "os"
          "path/filepath"

          "github.com/docker/docker/api/types"
          "github.com/docker/docker/api/types/container"
          "github.com/docker/docker/api/types/mount"
          "github.com/docker/docker/api/types/network"
          "github.com/docker/docker/client"
          "github.com/docker/docker/pkg/archive"
          "github.com/docker/docker/pkg/stdcopy"
          "github.com/docker/go-connections/nat"

          "github.com/candacelabs/dis/internal/config"
          "github.com/candacelabs/dis/internal/forward"
      )
      ```

      ## Types to Implement

      ```go
      // internal/container/manager.go
      package container

      type Manager struct {
          client client.APIClient  // interface for testability
          config *config.DisConfig
      }

      func NewManager(cfg *config.DisConfig) (*Manager, error)
      func (m *Manager) Up(ctx context.Context) error
      func (m *Manager) Down(ctx context.Context) error
      func (m *Manager) Exec(ctx context.Context, cmd []string, interactive bool) (int, error)
      func (m *Manager) Status(ctx context.Context) (*ContainerStatus, error)
      func (m *Manager) Rebuild(ctx context.Context) error
      func (m *Manager) Logs(ctx context.Context, follow bool, tail string) error
      func (m *Manager) NeedsRebuild(ctx context.Context) (bool, string, error)
      func (m *Manager) IsRunning(ctx context.Context) (bool, error)

      type ContainerStatus struct {
          ContainerName string
          State         string   // "running", "stopped", "not_found"
          Image         string
          Ports         []int
          Mounts        []string
          Uptime        string
      }
      ```

      ## Implementation Details

      ### NewManager
      1. `client.NewClientWithOpts(client.FromEnv, client.WithAPIVersionNegotiation())`
      2. `client.Ping(ctx)` — if error: return "Docker is not running. Start Docker Desktop (or dockerd) and try again."

      ### Up
      1. `NeedsRebuild()` → if true: build image
      2. Build image:
         - Create tar archive of `.dis/` directory
         - `client.ImageBuild(ctx, tar, types.ImageBuildOptions{Dockerfile: "Dockerfile", Tags: []string{cfg.ImageName}, Labels: {"dis.dockerfile.hash": sha256OfDockerfile}})`
         - Stream build output to stdout
      3. Check if container exists and running → return early "Already running"
      4. Remove any stopped container with same name
      5. Assemble mounts:
         - Bind mount: project root → /workspace
         - forward.GitMounts()
         - forward.SSHMounts()
         - forward.HistoryVolume(cfg.ProjectName, cfg.Shell)
         - cfg.ExtraMounts (convert config.Mount → mount.Mount)
      6. Assemble port bindings: `forward.PortBindings(cfg.Ports)`
      7. Assemble env vars: cfg.EnvVars (as KEY=VALUE strings) + git env vars + ssh env vars
      8. `client.ContainerCreate(ctx, containerConfig, hostConfig, nil, nil, cfg.ContainerName)`
         - containerConfig: Image, Env, ExposedPorts, WorkingDir="/workspace", Tty=true, OpenStdin=true
         - hostConfig: Binds/Mounts, PortBindings, RestartPolicy=no
      9. `client.ContainerStart(ctx, containerID, types.ContainerStartOptions{})`
      10. If cfg.PostCreate != "": exec it via Exec(ctx, []string{"sh", "-c", cfg.PostCreate}, false)
      11. Print summary

      ### Down
      1. Find container: `client.ContainerInspect(ctx, cfg.ContainerName)`
      2. If running: `client.ContainerStop(ctx, cfg.ContainerName, container.StopOptions{Timeout: intPtr(10)})`
      3. `client.ContainerRemove(ctx, cfg.ContainerName, types.ContainerRemoveOptions{})`
      4. If container not found: return nil (idempotent)

      ### Exec
      1. Create exec: `client.ContainerExecCreate(ctx, cfg.ContainerName, types.ExecConfig{Cmd, AttachStdout, AttachStderr, AttachStdin: interactive, Tty: interactive, WorkingDir: "/workspace"})`
      2. Attach: `client.ContainerExecAttach(ctx, execID, types.ExecStartCheck{Tty: interactive})`
      3. If interactive: raw terminal mode, copy stdin↔conn, stdout↔conn
      4. If not interactive: stdcopy.StdCopy(os.Stdout, os.Stderr, resp.Reader)
      5. Inspect exec for exit code: `client.ContainerExecInspect(ctx, execID)`
      6. Return exit code

      ### NeedsRebuild
      1. SHA256 hash the .dis/Dockerfile content
      2. Try to inspect image: `client.ImageInspect(ctx, cfg.ImageName)`
      3. If image not found: return (true, "image not found")
      4. Compare hash to image label "dis.dockerfile.hash"
      5. If different: return (true, "Dockerfile changed")
      6. Return (false, "")

      ## Testing Strategy
      Use a Docker client interface for testability:
      ```go
      // Extract the methods you call into an interface
      type DockerClient interface {
          Ping(ctx context.Context) (types.Ping, error)
          // ... other methods used
      }
      ```
      Create a mock client for unit tests. Test the logic, not Docker itself.
      For NeedsRebuild, test hash comparison logic.
      For Up, test mount assembly logic (can be extracted into a helper).

      ### health.go
      ```go
      // internal/container/health.go
      package container

      // WaitForReady polls the container until it's in "running" state.
      // Timeout after 30 seconds.
      func (m *Manager) WaitForReady(ctx context.Context) error
      ```

      ## Acceptance Criteria
      1. All tests pass: `go test ./internal/container/`
      2. Manager correctly assembles all mounts (workspace + git + ssh + history + extra)
      3. NeedsRebuild correctly compares Dockerfile hashes
      4. Down is idempotent (no error if container doesn't exist)
      5. Exec correctly handles both interactive and non-interactive modes
      6. Error messages are user-friendly

  - id: A5
    name: scaffold_init
    level: 1
    depends_on: [A0, A1, A2]
    input_protos: [DisConfig, ProjectType, DockerfileTemplateSpec]
    output_protos: [InitSpec, GenerateJustfileSpec, GenerateDockerfileSpec]
