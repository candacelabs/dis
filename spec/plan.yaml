# dis — DAG Execution Plan
# Canonical source of truth for agent-based implementation.
# Read spec/contracts/*.proto for typed agent I/O boundaries.

project:
  name: dis
  description: >
    Simple, plug-and-play dev containers. Single Go binary that manages Docker
    containers transparently via Justfile recipes. Zero config — convention over
    configuration via .dis/Dockerfile LABELs.
  repo_root: /home/u_kaashs/workspace/dis
  language: Go
  build_command: go build ./cmd/dis/
  test_command: go test ./...

# =============================================================================
# Tech Stack
# =============================================================================

tech_stack:
  language: "Go 1.22+"
  cli_framework: "github.com/spf13/cobra"
  docker_sdk: "github.com/docker/docker/client v25+"
  testing: "stdlib testing + github.com/stretchr/testify"
  build: "go build (single binary)"
  release: "goreleaser"
  linting: "golangci-lint"

# =============================================================================
# DAG — YAML Adjacency List
# =============================================================================

agents:
  - id: A0
    name: project_bootstrap
    level: 0
    depends_on: []
    input_protos: []
    output_protos: []
    reads: []
    writes:
      - go.mod
      - go.sum
      - cmd/dis/main.go
      - Justfile
      - .goreleaser.yml
      - README.md
      - LICENSE
      - .gitignore
    test_glob: ""
    description: >
      Initialize Go module, install dependencies, create skeleton main.go that
      compiles and prints version. Set up project infrastructure files.
    complexity: S
    acceptance_criteria:
      - "`go build ./cmd/dis/` succeeds"
      - "`./dis --version` prints version string"
      - "go.mod lists cobra, docker SDK, testify as dependencies"
      - "Justfile has build, test, lint, clean recipes"
      - ".goreleaser.yml configured for linux/darwin amd64/arm64"

    agent_prompt: |
      You are implementing the project bootstrap for `dis`, a Go CLI tool for dev containers.

      ## Task
      Initialize the Go project at /home/u_kaashs/workspace/dis with all infrastructure files.

      ## Files to Create

      ### go.mod
      ```
      module github.com/candacelabs/dis
      go 1.22
      ```
      Then run: `go get github.com/spf13/cobra@latest github.com/docker/docker/client@v25.0.0 github.com/stretchr/testify@latest`
      Also need: `github.com/docker/go-connections` for nat package.

      ### cmd/dis/main.go
      Minimal cobra root command:
      - Use: "dis"
      - Short: "Simple, plug-and-play dev containers"
      - Version: "0.1.0"
      - No subcommands yet (just root + version flag)
      - Must compile and run: `./dis --version` → "dis version 0.1.0"

      ### Justfile
      ```just
      # dis development recipes

      default:
          @just --list

      build:
          go build -o dis ./cmd/dis/

      test:
          go test ./... -v

      lint:
          golangci-lint run ./...

      clean:
          rm -f dis
          go clean

      install:
          go install ./cmd/dis/
      ```

      ### .goreleaser.yml
      Standard Go binary release config:
      - Builds for linux/darwin, amd64/arm64
      - Archive format: tar.gz for linux, zip for darwin
      - No CGO

      ### README.md
      ```markdown
      # dis

      Simple, plug-and-play dev containers. Part of [Candace Labs](https://github.com/candacelabs).

      ## Install

      ```bash
      go install github.com/candacelabs/dis/cmd/dis@latest
      ```

      ## Quick Start

      ```bash
      cd your-project
      dis init        # scaffold .dis/Dockerfile + Justfile
      just dev        # start dev environment
      just build      # run build inside container
      just shell      # drop into container shell
      just down       # stop container
      ```

      ## License

      MIT
      ```

      ### LICENSE
      MIT license, copyright 2025 Candace Labs.

      ### .gitignore
      Standard Go .gitignore: binary, vendor, .DS_Store, *.exe, /dis

      ## Acceptance Criteria
      1. `go build ./cmd/dis/` succeeds with zero errors
      2. `./dis --version` prints "dis version 0.1.0"
      3. `go mod tidy` makes no changes (deps are clean)
      4. Justfile recipes work: `just build` compiles the binary

  - id: A1
