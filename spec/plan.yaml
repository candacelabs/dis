      - "DockerfileTemplate(Unknown) returns generic ubuntu Dockerfile"
      - "All templates include WORKDIR /workspace and sensible dis.* LABELs"
      - "All tests pass with go test ./internal/scaffold/"

    agent_prompt: |
      You are implementing project type detection and Dockerfile template generation for `dis`.

      ## Context
      `dis init` needs to detect what kind of project it's in (Node, Python, Go, Rust, or unknown)
      and generate an appropriate `.dis/Dockerfile` for that project type.

      ## Proto Contract (see spec/contracts/scaffold.proto)

      ### Types to implement:

      ```go
      // internal/scaffold/detect.go
      package scaffold

      type ProjectType string

      const (
          ProjectTypeNode    ProjectType = "node"
          ProjectTypePython  ProjectType = "python"
          ProjectTypeGo      ProjectType = "go"
          ProjectTypeRust    ProjectType = "rust"
          ProjectTypeUnknown ProjectType = "unknown"
      )

      // DetectProjectType inspects projectRoot for language marker files.
      // First match wins in this order: Node, Python, Go, Rust, Unknown.
      func DetectProjectType(projectRoot string) ProjectType
      ```

      ```go
      // internal/scaffold/templates.go
      package scaffold

      // DockerfileTemplate returns a complete Dockerfile string for the given project type.
      // Uses Go embed or string literals for templates.
      func DockerfileTemplate(projectType ProjectType) string
      ```

      ## Detection Rules (first match wins)
      1. `package.json` exists → Node
      2. `pyproject.toml` OR `requirements.txt` OR `setup.py` exists → Python
      3. `go.mod` exists → Go
      4. `Cargo.toml` exists → Rust
      5. else → Unknown

      Detection checks file existence in the project root only (not recursive).

      ## Dockerfile Templates

      ### Node template:
      ```dockerfile
      FROM node:20-bookworm

      LABEL dis.ports="3000"
      LABEL dis.shell="/bin/bash"
      LABEL dis.post_create="npm install"

      RUN apt-get update && apt-get install -y git curl && rm -rf /var/lib/apt/lists/*
      WORKDIR /workspace
      ```

      ### Python template:
      ```dockerfile
      FROM python:3.12-bookworm

      LABEL dis.shell="/bin/bash"
      LABEL dis.post_create="pip install -r requirements.txt"

      RUN apt-get update && apt-get install -y git curl && rm -rf /var/lib/apt/lists/*
      WORKDIR /workspace
      ```

      ### Go template:
      ```dockerfile
      FROM golang:1.22-bookworm

      LABEL dis.ports="8080"
      LABEL dis.shell="/bin/bash"

      RUN apt-get update && apt-get install -y git curl && rm -rf /var/lib/apt/lists/*
      WORKDIR /workspace
      ```

      ### Rust template:
      ```dockerfile
      FROM rust:1.77-bookworm

      LABEL dis.ports="8080"
      LABEL dis.shell="/bin/bash"

      RUN apt-get update && apt-get install -y git curl pkg-config libssl-dev && rm -rf /var/lib/apt/lists/*
      WORKDIR /workspace
      ```

      ### Unknown template:
      ```dockerfile
      FROM ubuntu:22.04

      LABEL dis.shell="/bin/bash"

      RUN apt-get update && apt-get install -y git curl build-essential && rm -rf /var/lib/apt/lists/*
      WORKDIR /workspace
      ```

      ## Tests

      ### detect_test.go
      Use `t.TempDir()` to create temp directories with marker files.
      1. TestDetectProjectType_Node — create package.json, expect Node
      2. TestDetectProjectType_Python_Pyproject — create pyproject.toml, expect Python
      3. TestDetectProjectType_Python_Requirements — create requirements.txt, expect Python
      4. TestDetectProjectType_Go — create go.mod, expect Go
      5. TestDetectProjectType_Rust — create Cargo.toml, expect Rust
      6. TestDetectProjectType_Unknown — empty dir, expect Unknown
      7. TestDetectProjectType_Priority — create package.json + go.mod, expect Node (first wins)

      ### templates_test.go
      1. TestDockerfileTemplate_Node — verify contains "FROM node:", dis.ports, dis.post_create
      2. TestDockerfileTemplate_Python — verify contains "FROM python:", dis.post_create
      3. TestDockerfileTemplate_Go — verify contains "FROM golang:"
      4. TestDockerfileTemplate_Rust — verify contains "FROM rust:", pkg-config
      5. TestDockerfileTemplate_Unknown — verify contains "FROM ubuntu:"
      6. TestDockerfileTemplate_AllHaveWorkdir — all templates contain "WORKDIR /workspace"
      7. TestDockerfileTemplate_AllHaveShell — all templates contain "dis.shell"

      ## Acceptance Criteria
      1. All tests pass: `go test ./internal/scaffold/`
      2. DetectProjectType correctly identifies all 5 types
      3. Each template is a valid Dockerfile (starts with FROM, has WORKDIR)
      4. Templates include sensible dis.* LABELs for each language

  - id: A3
    name: forwarding
    level: 0
    depends_on: []
