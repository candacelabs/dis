      Implement convention-based config resolution. Parse .dis/Dockerfile for
      LABEL directives, extract dis.* labels, resolve to DisConfig struct with defaults.
    complexity: M
    acceptance_criteria:
      - "ParseLabelsFromDockerfile extracts all dis.* labels from a Dockerfile"
      - "Handles multi-line LABELs and quoted values"
      - "Handles LABEL key=value and LABEL key value formats"
      - "dis.ports='3000,8080' parses to []int{3000, 8080}"
      - "dis.env='NODE_ENV=development,DEBUG=true' parses to []EnvVar"
      - "dis.mounts='./data:/data' parses to []Mount"
      - "dis.shell defaults to /bin/bash if not set"
