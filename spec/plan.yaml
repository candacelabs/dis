      Implement host-to-container forwarding: git credentials, SSH agent, port
      bindings, and shell history volume.
    complexity: M
    acceptance_criteria:
      - "GitMounts returns bind mount for ~/.gitconfig if it exists"
      - "GitMounts returns empty if no git config found"
      - "SSHMounts returns SSH_AUTH_SOCK mount if env var is set"
      - "SSHMounts returns empty if SSH_AUTH_SOCK not set"
